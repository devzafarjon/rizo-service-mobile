name: rizo_core
description: Shared code for the RIZO Service mobile apps (API client, translations, models, offline queue, widgets).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: ">=3.35.0"

dependencies:
  connectivity_plus: ^7.3.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/locales/
    - assets/mobile/
    - assets/rizo-logo.png
